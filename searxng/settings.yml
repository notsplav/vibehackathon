# Конфигурация локального SearXNG для поиска источников (npm run searxng:up).
# secret_key не хранится в репозитории: скрипт запуска передаёт случайный SEARXNG_SECRET.
use_default_settings: true

general:
  instance_name: "vibehackathon-search"

server:
  # Внутри контейнера; наружу порт публикуется только на 127.0.0.1.
  bind_address: "0.0.0.0"
  port: 8080
  # Защита от ботов мешает API-запросам локального сервера.
  limiter: false
  image_proxy: false
  public_instance: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  # JSON нужен локальному серверу; без него SearXNG отвечает 403.
  formats:
    - html
    - json

  # Блокировка поисковика после ошибки по умолчанию длится от 3 минут до часа; для локальной проверки — короче.
  suspended_times:
    SearxEngineAccessDenied: 60
    SearxEngineCaptcha: 300
    SearxEngineTooManyRequests: 60
    cf_SearxEngineCaptcha: 300
    cf_SearxEngineAccessDenied: 60
    recaptcha_SearxEngineCaptcha: 300

# По умолчанию включено мало веб-поисковиков, и при частых запросах все они быстро блокируются.
# Чем больше источников выдачи, тем реже пустые ответы.
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: yahoo
    disabled: false
  - name: yandex
    disabled: false
  - name: qwant
    disabled: false

outgoing:
  request_timeout: 5.0
  max_request_timeout: 10.0
